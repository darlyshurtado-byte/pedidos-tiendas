<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirmar pedido: Tienda Demo Santa Marta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --mar:#0F4C5C; --mango:#F2B705; --papel:#FFFFFF; --tinta:#1C2321; --cielo:#E6F0F1; --gris:#5E6B6E;
  --linea:#D5E1E3; --verde:#1E8E4E; --rojo:#C0392B; --fondo:#F7FAFA;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --mar:#7FC4D4; --papel:#1B2427; --tinta:#EEF3F3; --cielo:#22343A; --gris:#A2B1B4; --linea:#2F4248; --verde:#3DBE72; --rojo:#E57364; --fondo:#131B1D; }
}
:root[data-theme="dark"]{ --mar:#7FC4D4; --papel:#1B2427; --tinta:#EEF3F3; --cielo:#22343A; --gris:#A2B1B4; --linea:#2F4248; --verde:#3DBE72; --rojo:#E57364; --fondo:#131B1D; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.tienda{font-size:13px;color:var(--gris);margin:0}
h1{font-size:22px;line-height:1.1;font-weight:800;margin:2px 0 8px;color:var(--mar);letter-spacing:-0.02em}
.paso{font-weight:800;color:var(--mar);margin:14px 0 4px;font-size:14px}
textarea{width:100%;min-height:130px;border:3px solid var(--mar);border-radius:16px;padding:12px;font:inherit;font-size:16px;background:var(--papel);color:var(--tinta);resize:vertical}
.ayuda{font-size:14px;color:var(--gris);margin:6px 2px 0}
.btn{border:0;border-radius:14px;font:inherit;font-weight:800;cursor:pointer;padding:13px 16px}
.prim{background:var(--mar);color:var(--papel);width:100%;margin-top:10px;font-size:15px}
.verde{background:var(--verde);color:#fff;width:100%;font-size:16px;display:block;text-align:center;text-decoration:none}
.sec{background:var(--cielo);color:var(--tinta);width:100%;margin-top:8px}
.item{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:8px 10px;margin-top:6px}
.item .fila{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .nom{font-weight:600;font-size:14px}
.item .val{font-weight:800;font-size:14px;white-space:nowrap}
.ops{display:flex;gap:6px;margin-top:6px}
.op{flex:1;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);border-radius:10px;padding:6px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.op[aria-pressed="true"].hay{border-color:var(--verde);background:var(--verde);color:#fff}
.op[aria-pressed="true"].nohay{border-color:var(--rojo);background:var(--rojo);color:#fff}
.op[aria-pressed="true"].otra{border-color:var(--mango);background:var(--mango);color:#1C2321}
.alt{display:none;margin-top:6px;gap:6px}
.alt input[data-k="altV"]{max-width:110px}
.alt.on{display:flex}
.alt input,.dom input{border:1.5px solid var(--linea);border-radius:10px;padding:8px;font:inherit;font-size:16px;background:var(--papel);color:var(--tinta);width:100%}
.dom{display:flex;align-items:center;gap:10px;margin-top:6px}
.dom span{font-weight:800}
.resumen{background:var(--papel);border:1px dashed var(--linea);border-radius:10px;padding:10px;margin-top:6px;white-space:pre-wrap;font-size:13px;color:var(--gris)}
.ver{margin-top:8px;font-size:13px;color:var(--mar)}
.ver summary{cursor:pointer;font-weight:600;text-align:center;padding:4px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px 10px;font-weight:600}
.total b{font-size:20px}
.error{color:var(--rojo);font-size:15px;margin-top:8px}
.oculto{display:none}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <p class="tienda">Tienda Demo Santa Marta</p>
  <h1>Confirmar pedido</h1>

  <p class="ayuda" id="cargando" style="display:none">Cargando pedido…</p>

  <section id="s1">
    <p class="paso">1. Pega el pedido del cliente</p>
    <textarea id="txt" placeholder="En WhatsApp, deja presionado el mensaje del cliente, toca Copiar y pégalo aquí."></textarea>
    <button class="btn prim" id="leer" type="button">Revisar pedido</button>
    <p class="error" id="err"></p>
  </section>

  <section id="s2" class="oculto">
    <p class="paso">Marca lo que tienes</p>
    <div id="items"></div>

    <p class="paso">Domicilio</p>
    <div class="dom"><span>$</span><input id="dom" inputmode="numeric" placeholder="Ej. 3000"></div>

    <div class="total"><span>Total para el cliente</span><b id="tot">$0</b></div>

    <a class="btn verde" id="enviar" href="#" target="_blank" rel="noopener">Responder al cliente por WhatsApp</a>
    <details class="ver"><summary>Ver mensaje</summary><div class="resumen" id="msg"></div></details>
    <button class="btn sec" id="otro" type="button">Revisar otro pedido</button>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const plata=v=>"$"+Math.round(v).toLocaleString("es-CO");
const num=s=>Number(String(s||"").replace(/[^0-9]/g,""))||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let L=[];

function leer(texto){
  return texto.split(/\r?\n/).map(l=>l.trim()).filter(l=>/^[•\-\*]/.test(l)).map(l=>{
    l=l.replace(/^[•\-\*]\s*/,"");
    const i=l.lastIndexOf("=");
    if(i<0) return null;
    return {txt:l.slice(0,i).trim(), v:num(l.slice(i+1)), est:"hay", alt:"", altV:""};
  }).filter(Boolean);
}

function pintarItems(){
  $("#items").innerHTML=L.map((x,i)=>`
    <div class="item">
      <div class="fila"><span class="nom">${esc(x.txt)}</span><span class="val">${plata(x.v)}</span></div>
      <div class="ops" role="group" aria-label="Disponibilidad">
        <button class="op hay" type="button" data-i="${i}" data-e="hay" aria-pressed="${x.est==="hay"}">✅ Hay</button>
        <button class="op nohay" type="button" data-i="${i}" data-e="nohay" aria-pressed="${x.est==="nohay"}">❌ No hay</button>
        <button class="op otra" type="button" data-i="${i}" data-e="otra" aria-pressed="${x.est==="otra"}">🔄 Otra</button>
      </div>
      <div class="alt ${x.est==="otra"?"on":""}">
        <input data-i="${i}" data-k="alt" placeholder="Producto. Ej. Arroz Pinillar 1 lb" value="${esc(x.alt)}">
        <input data-i="${i}" data-k="altV" inputmode="numeric" placeholder="Valor" value="${esc(x.altV)}">
      </div>
    </div>`).join("");
}

function calcular(){
  const dom=num($("#dom").value);
  let total=0; const obs=[];
  L.forEach(x=>{
    if(x.est==="hay"){ total+=x.v; }
    else if(x.est==="nohay"){ obs.push(`❌ ${x.txt}: no hay`); }
    else {
      const v=num(x.altV); total+=v;
      obs.push(`🔄 ${x.txt}: no hay, pero tengo ${x.alt||"otra presentación"}${v?` = ${plata(v)}`:""}. ¿Te sirve?`);
    }
  });
  total+=dom;
  const pie=(dom?`Domicilio: ${plata(dom)}\n`:"")+`Total: ${plata(total)}`;
  const msg=obs.length
    ? "¡Hola! Revisamos tu pedido. Esto tiene cambios:\n"+obs.join("\n")+"\n\nLo demás sí lo tenemos ✅\n"+pie+"\n\n¿Lo confirmamos? ¿Pagas en efectivo o por transferencia?"
    : "¡Hola! Tu pedido está confirmado ✅\n"+pie+"\n\n¿Pagas en efectivo o por transferencia?";
  $("#tot").textContent=plata(total);
  $("#msg").textContent=msg;
  $("#enviar").href="https://wa.me/?text="+encodeURIComponent(msg);
}

$("#leer").addEventListener("click",()=>{
  L=leer($("#txt").value);
  if(!L.length){ $("#err").textContent="No encontré productos. Copia el mensaje completo del pedido, desde \"¡Hola! Quiero hacer este pedido\"."; return; }
  $("#err").textContent="";
  $("#s1").classList.add("oculto"); $("#s2").classList.remove("oculto");
  pintarItems(); calcular(); window.scrollTo(0,0);
});
$("#items").addEventListener("click",e=>{
  const b=e.target.closest(".op"); if(!b) return;
  L[b.dataset.i].est=b.dataset.e; pintarItems(); calcular();
});
$("#items").addEventListener("input",e=>{
  const t=e.target; if(!t.dataset.k) return;
  L[t.dataset.i][t.dataset.k]=t.value; calcular();
});
$("#dom").addEventListener("input",calcular);
$("#otro").addEventListener("click",()=>{
  L=[]; $("#txt").value=""; $("#dom").value="";
  $("#s2").classList.add("oculto"); $("#s1").classList.remove("oculto"); $("#txt").focus();
});

/* Si el pedido llega por el enlace corto (?p=P001-1.P012-0.5&t=Tienda), se arma desde el Excel */
const nrmL=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const capL=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):"";
function objs(ws){return XLSX.utils.sheet_to_json(ws,{defval:""}).map(f=>{const o={};Object.keys(f).forEach(k=>{o[nrmL(k).replace(/\s+/g,"_")]=typeof f[k]==="string"?f[k].trim():f[k];});return o;});}
function palabras(k){const e=Math.floor(k),r=Math.round((k-e)*4);
  if(!e) return ["","un cuarto de libra","media libra","tres cuartos de libra"][r];
  return (e===1?"1 libra":e+" libras")+["",", y cuarto"," y media"," y tres cuartos"][r].replace(", y"," y");}
function gramos(k){const g=Math.round(k*500);return g>=1000?(g/1000).toLocaleString("es-CO")+" kg":g+" g";}
(async function(){
  const q=new URLSearchParams(location.search); const p=q.get("p")||"";
  if(!p) return;
  if(!/^[A-Za-z0-9_]+-[\d.]+/.test(p)){ $("#txt").value=p; $("#leer").click(); return; }
  $("#s1").classList.add("oculto"); $("#cargando").style.display="block";
  try{
    await new Promise((ok,mal)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=mal;document.head.appendChild(s);});
    const r=await fetch("catalogo-tiendas.xlsx",{cache:"no-store"}); const wb=XLSX.read(await r.arrayBuffer(),{type:"array"});
    const tiendas=wb.SheetNames.filter(n=>!["instrucciones","listas","maestro"].includes(nrmL(n)));
    const hoja=tiendas.find(t=>nrmL(t)===nrmL(q.get("t")))||tiendas[0];
    const M={}; objs(wb.Sheets[wb.SheetNames.find(n=>nrmL(n)==="maestro")]).forEach(m=>{if(m.codigo)M[String(m.codigo).toUpperCase()]=m;});
    const PR={}; objs(wb.Sheets[hoja]).forEach(t=>{if(t.codigo)PR[String(t.codigo).toUpperCase()]=Math.round(Number(String(t.precio).replace(/[^0-9.]/g,"")))||0;});
    L=p.split("~").map(par=>{
      const i=par.lastIndexOf("-"); const cod=par.slice(0,i).toUpperCase(); const k=Number(par.slice(i+1))||0;
      const m=M[cod]; if(!m||!k) return null;
      const peso=nrmL(m.se_vende_por)==="peso"; const precio=PR[cod]||0;
      const nom=capL(m.producto)+(m.marca?" "+capL(m.marca):"");
      const pres=[capL(String(m.empaque||"").toLowerCase()),m.contenido,m.medida].filter(Boolean).join(" ");
      const txt=peso?`${palabras(k)} (${gramos(k)}) de ${nom}`:`${k} × ${nom}${pres?" ("+pres+")":""}`;
      return {txt, v:Math.round(precio*k), est:"hay", alt:"", altV:""};
    }).filter(Boolean);
    $("#cargando").style.display="none";
    if(!L.length){ $("#s1").classList.remove("oculto"); return; }
    $("#s2").classList.remove("oculto"); pintarItems(); calcular();
  }catch(e){ $("#cargando").style.display="none"; $("#s1").classList.remove("oculto"); $("#err").textContent="No pude cargar el pedido desde el enlace. Puedes pegarlo aquí."; }
})();
</script>
</body>
</html>
